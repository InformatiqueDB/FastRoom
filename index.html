<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastRoom - DB Cargo France</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Barre supérieure : Horloge, titre discret, date -->
  <div class="top-bar">
    <div id="live-time" class="bar-left">--:--:--</div>
    <div class="bar-center">DB Cargo France &bull; Réservation express</div>
    <div id="live-date" class="bar-right">--/--/----</div>
  </div>

  <!-- En-tête principal avec Logo, Titre et Notice bien visible -->
  <header class="main-header">
    <div class="header-left">
      <img src="DBCargo.png" alt="DB Cargo" class="logo-db" />
    </div>
    
    <div class="header-center">
      <h1 class="main-title">FastRoom.</h1>
      
      <!-- Encart informatif agrandi et mis en valeur -->
      <div class="header-notice">
        <span class="notice-badge">Sur place uniquement</span>
        <p class="notice-text">
          Vérifiez la tablette devant la salle et réservez pour maintenant. 
          <strong>(Pas de réservation à l'avance)</strong>.
        </p>
      </div>
    </div>

    <!-- Espace d'équilibrage à droite pour centrer parfaitement le titre -->
    <div class="header-right"></div>
  </header>

  <!-- Onglets de navigation -->
  <nav class="nav-tabs">
    <button class="tab-btn active" type="button">
      Réservation Express (À l'instant T)
    </button>
    <a href="#" class="tab-btn external-link" target="_blank" rel="noopener noreferrer">
      Planification avancée (KRBS) &#x2197;
    </a>
  </nav>

  <!-- Barre de filtres : compteur, sélecteur d'étage, slider de capacité -->
  <div class="toolbar">
    <div class="room-count"><span id="count-value">8</span> salles</div>

    <div class="filter-controls">
      <!-- Filtres d'étages -->
      <div class="floor-selector">
        <button class="floor-btn active" data-floor="3">3ème étage</button>
        <button class="floor-btn" data-floor="0">RDC</button>
      </div>

      <!-- Filtre de capacité -->
      <div class="capacity-filter">
        <label for="capacity-range">Capacité min.</label>
        <input type="range" id="capacity-range" min="1" max="15" value="1" />
        <button id="reset-capacity-btn" class="btn-all-caps">Toutes</button>
      </div>
    </div>
  </div>

  <!-- Grille des salles -->
  <main class="rooms-container" id="rooms-grid">
    <!-- Rempli dynamiquement par app.js -->
  </main>

  <script src="app.js"></script>
</body>
</html>
