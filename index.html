<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastRoom — Réservation instantanée</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <!-- Bandeau supérieur noir -->
  <div class="header__board">
    <div class="header__board-inner">
      <div class="clock" id="liveClock" aria-live="polite">
        <span class="clock__time">
          <span id="clockH">--</span><span class="clock__colon">:</span><span id="clockM">--</span><span class="clock__colon">:</span><span id="clockS">--</span>
        </span>
      </div>
      <div class="board-caption">DB Cargo France · Réservation express</div>
      <div class="date" id="liveDate" aria-live="polite">
        <span class="date__text" id="dateValue">--/--/----</span>
      </div>
    </div>
  </div>

  <!-- Section principale rouge -->
  <div class="header__inner">
    <div class="header__logo">
      <img src="../reservation salle instant T/images/DBCargo.png" alt="Logo DB Cargo">
    </div>

    <!-- Le titre est maintenant centré, et l'espace à droite est libre -->
    <div class="brand">
      <h1 class="brand__name">FastRoom<span class="brand__dot">.</span></h1>
      <p class="brand__sub">Choisissez une salle, une durée.</p>
    </div>
  </div>
</header>

<!-- Barre d'onglets façon navigateur -->
<nav class="main-nav">
  <div class="main-nav__inner">
    <a href="#" class="main-nav__tab main-nav__tab--active">Réservation Express (À l'instant T)</a>
    <a href="https://krbs.intranet.deutschebahn.com/roomtool/booking/searchRoomExecute.do" class="main-nav__tab" target="_blank" rel="noopener noreferrer">Planification avancée (KRBS) ↗</a>
  </div>
</nav>

<main class="main-content">
  
  <!-- NOUVEAU : Barre d'outils avec compteur, étages et filtre regroupés -->
  <div class="toolbar">
    <div class="result-count" id="resultCount" aria-live="polite"></div>
    
    <div class="toolbar__controls">
      <!-- Choix de l'étage déplacé ici -->
      <div class="floor-tabs" role="tablist" aria-label="Étage">
        <button class="floor-tab floor-tab--active" id="tab-3" role="tab" aria-selected="true">3ème étage</button>
        <button class="floor-tab" id="tab-RDC" role="tab" aria-selected="false">RDC</button>
      </div>

      <!-- Filtre de capacité -->
      <div class="capacity-filter">
        <label for="capacity-slider" class="capacity-label">Capacité min.</label>
        <input type="range" id="capacity-slider" min="0" max="40" step="1" value="0">
        <input type="text" id="capacity-input" value="Toutes" title="Entrez le nombre de participants" inputmode="numeric">
      </div>
    </div>
  </div>

  <!-- Wrapper pour inclure les flèches de défilement rapide -->
  <div class="grid-wrapper">
    <button class="scroll-arrow scroll-left" id="scrollLeftBtn" aria-label="Défiler à gauche">❮</button>
    <button class="scroll-arrow scroll-right" id="scrollRightBtn" aria-label="Défiler à droite">❯</button>

    <!-- Grille 3ème étage (Affichée par défaut) -->
    <div id="grid-3" class="grid-container active">
      <div class="empty-state" id="empty-3">
        <p>Aucune salle avec cette capacité à cet étage.</p>
        <button type="button" class="empty-state__reset" data-reset-filter>Réinitialiser le filtre</button>
      </div>
    </div>

    <!-- Grille RDC (Cachée par défaut) -->
    <div id="grid-RDC" class="grid-container">
      <div class="empty-state" id="empty-RDC">
        <p>Aucune salle avec cette capacité à cet étage.</p>
        <button type="button" class="empty-state__reset" data-reset-filter>Réinitialiser le filtre</button>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
